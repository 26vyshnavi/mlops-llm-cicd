# ═══════════════════════════════════════════════════════════════════════════════
# cd.yml — Continuous Deployment: Fine-tune → Push to HF Hub → Deploy to Spaces
#
# WHAT IS CD?
#   Continuous Deployment means every merge to main triggers automatic
#   deployment to production. No manual steps, no "release manager" bottleneck.
#   The pipeline:
#     1. TRAIN:   Fine-tune DistilGPT-2 on XSum (small subset for speed)
#     2. PUSH:    Upload the fine-tuned model to HuggingFace Hub (model registry)
#     3. DEPLOY:  Push the Gradio app to HuggingFace Spaces (hosting)
#
# WHY SEPARATE FROM CI?
#   CI runs on every push (including feature branches). CD only runs on
#   merges to main. Separating them means:
#     - Feature branches get fast feedback without triggering expensive training
#     - Deployment only happens after code review + CI has passed
#
# SECRETS REQUIRED (set in GitHub → Settings → Secrets and variables → Actions):
#   HF_TOKEN      : Your HuggingFace API token (write access)
#                   Get it at: https://huggingface.co/settings/tokens
#   HF_USERNAME   : Your HuggingFace username (e.g. "manish")
#   HF_SPACE_NAME : The name of your HF Space (e.g. "distilgpt2-summarizer")
#
# ARCHITECTURE:
#   GitHub repo ──[push to main]──► CI passes
#                                      │
#                                      ▼
#                               Fine-tune model (Job 1)
#                                      │
#                              Push model to HF Hub (Job 1)
#                              e.g. hf.co/manish/distilgpt2-summarizer
#                                      │
#                                      ▼
#                              Deploy app to HF Spaces (Job 2)
#                              e.g. hf.co/spaces/manish/distilgpt2-summarizer
#                              (App loads the model from HF Hub at runtime)
# ═══════════════════════════════════════════════════════════════════════════════

name: CD — Fine-tune · Push to Hub · Deploy

on:
  push:
    branches: ["main"]         # Only deploy from main
  workflow_dispatch:           # Also allow manual triggers from the GitHub UI
    inputs:
      dataset_size:
        description: "Number of training samples (default: 500 for speed)"
        required: false
        default: "500"
      num_epochs:
        description: "Number of training epochs"
        required: false
        default: "1"

# Only one deployment should run at a time.
# If a new push arrives while deploying, wait for the current run to finish.
concurrency:
  group: cd-production
  cancel-in-progress: false    # Don't cancel — finish the current deploy first

jobs:

  # ── Job 1: Fine-tune + Push Model to HF Hub ─────────────────────────────────
  train-and-push:
    name: "🔥 Fine-tune & Push Model"
    runs-on: ubuntu-latest
    # Skip this job if the commit message contains [skip-train]
    # Useful when you only changed the app UI, not the model.
    if: "!contains(github.event.head_commit.message, '[skip-train]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      # Cache the HuggingFace model downloads between runs.
      # DistilGPT-2 weights (~300 MB) are downloaded on first run;
      # cached runs reuse them, saving ~2 minutes of download time.
      - name: Cache HuggingFace model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-distilgpt2-${{ runner.os }}
          restore-keys: |
            hf-cache-distilgpt2-

      - name: Fine-tune DistilGPT-2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # workflow_dispatch input takes priority; falls back to default 500
          DATASET_SIZE: ${{ github.event.inputs.dataset_size || '500' }}
          NUM_EPOCHS: ${{ github.event.inputs.num_epochs || '1' }}
        run: |
          python - <<'EOF'
          import os
          from src.config import TrainingConfig
          from src.train import train

          # Use a small dataset slice so CI finishes in ~10-15 minutes.
          # For a real project, you'd use a GPU runner and the full dataset.
          config = TrainingConfig(
              model_name="distilgpt2",
              dataset_name="xsum",
              dataset_split_size=int(os.environ["DATASET_SIZE"]),
              num_epochs=int(os.environ["NUM_EPOCHS"]),
              batch_size=4,          # Smaller batch for CPU
              learning_rate=2e-5,
              output_dir="./model_output",
              hub_model_id=f"{os.environ.get('HF_USERNAME', 'user')}/distilgpt2-summarizer",
          )

          print(f"Training with {config.dataset_split_size} samples, {config.num_epochs} epoch(s)")
          model, tokenizer = train(config)
          print("Training complete!")
          EOF
        # Note: train() will push to HF Hub automatically if HF_TOKEN is set
        # and hub_model_id is configured (see src/train.py).

      - name: Run ROUGE evaluation on validation set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          from datasets import load_dataset
          from src.config import InferenceConfig
          from src.inference import SummarizationPipeline
          from src.evaluate import compute_rouge

          # Load 50 validation examples for quick evaluation
          dataset = load_dataset("xsum", split="validation[:50]", trust_remote_code=True)

          config = InferenceConfig(model_path="./model_output", max_new_tokens=60)
          pipeline = SummarizationPipeline(config=config)

          predictions = [pipeline.summarize(doc) for doc in dataset["document"]]
          scores = compute_rouge(predictions, dataset["summary"])

          print("\n── Evaluation Results ──────────────────────")
          for metric, score in scores.items():
              print(f"  {metric}: {score:.4f}")

          # Write scores to GitHub step summary for visibility in the UI
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### 📊 ROUGE Evaluation Results\n\n")
              f.write("| Metric | Score |\n|--------|-------|\n")
              for metric, score in scores.items():
                  f.write(f"| {metric} | {score:.4f} |\n")
          EOF

      - name: Upload fine-tuned model as artifact
        # Store the model as a GitHub artifact (available for 7 days).
        # This lets you download and inspect the model without HF Hub access.
        uses: actions/upload-artifact@v4
        with:
          name: fine-tuned-model-${{ github.sha }}
          path: model_output/
          retention-days: 7

  # ── Job 2: Deploy to HuggingFace Spaces ─────────────────────────────────────
  deploy-to-spaces:
    name: "🚀 Deploy to HF Spaces"
    runs-on: ubuntu-latest
    needs: train-and-push    # Wait for training to complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # Full history needed for git push

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface-hub CLI
        run: pip install huggingface-hub>=0.22.0

      - name: Deploy app files to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python - <<'EOF'
          # HOW HF SPACES DEPLOYMENT WORKS:
          #   We use the HuggingFace Hub API to upload our app files directly
          #   to the Space's repository. HF Spaces then:
          #     1. Detects the Dockerfile
          #     2. Builds the Docker image (using HF's free build servers)
          #     3. Starts the container and routes traffic to port 7860
          #
          # The app itself (app/app.py) loads the model from HF Hub at startup
          # using the MODEL_PATH env var set in the Space settings.

          import os
          from huggingface_hub import HfApi, login

          login(token=os.environ["HF_TOKEN"])
          api = HfApi()

          username = os.environ["HF_USERNAME"]
          space_name = os.environ["HF_SPACE_NAME"]
          repo_id = f"{username}/{space_name}"

          print(f"Deploying to: https://huggingface.co/spaces/{repo_id}")

          # Create the Space if it doesn't already exist
          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,         # No error if Space already exists
              )
              print(f"Space '{repo_id}' ready.")
          except Exception as e:
              print(f"Space creation note: {e}")

          # Upload the files the Space needs to run.
          # The Dockerfile at root + src/ + app/ is everything required.
          files_to_upload = [
              ("Dockerfile", "Dockerfile"),
              ("requirements.txt", "requirements.txt"),
              ("src/config.py", "src/config.py"),
              ("src/inference.py", "src/inference.py"),
              ("src/__init__.py", "src/__init__.py"),
              ("app/app.py", "app/app.py"),
              ("app/__init__.py", "app/__init__.py"),
          ]

          for local_path, remote_path in files_to_upload:
              if os.path.exists(local_path):
                  api.upload_file(
                      path_or_fileobj=local_path,
                      path_in_repo=remote_path,
                      repo_id=repo_id,
                      repo_type="space",
                  )
                  print(f"  Uploaded: {local_path} → {remote_path}")

          # Set MODEL_PATH to point at the HF Hub model we just pushed
          model_hub_id = f"{username}/distilgpt2-summarizer"
          try:
              api.add_space_variable(repo_id=repo_id, key="MODEL_PATH", value=model_hub_id)
              print(f"  Set MODEL_PATH = '{model_hub_id}'")
          except Exception as e:
              print(f"  Could not set space variable: {e}")

          print(f"\n✅ Deployed! Space URL: https://huggingface.co/spaces/{repo_id}")
          EOF

      - name: Post deployment summary
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Space URL:** https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Model URL:** https://huggingface.co/${{ secrets.HF_USERNAME }}/distilgpt2-summarizer" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⏱️  The Space will be live in ~2-3 minutes while HF builds the Docker image." >> $GITHUB_STEP_SUMMARY
