# pyproject.toml — Modern Python project configuration (PEP 517/518/621).
#
# WHY pyproject.toml instead of setup.py?
#   pyproject.toml is the modern standard (PEP 517). It:
#     - Combines build config, tool config, and project metadata in one file
#     - Is read by pip, pytest, ruff, mypy — no more setup.cfg juggling
#     - Makes the project installable with: pip install -e .
#
# Running `pip install -e .` (editable install) lets Python find `src` and `app`
# as packages without needing PYTHONPATH hacks.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-llm-cicd"
version = "0.1.0"
description = "MLOps CI/CD pipeline for DistilGPT-2 summarization"
requires-python = ">=3.10"
readme = "README.md"

# ── Ruff configuration ────────────────────────────────────────────────────────
# ruff is a drop-in replacement for flake8 + isort, written in Rust.
# It checks ~700 lint rules and auto-fixes many of them.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort
select = ["E", "F", "W", "I"]
# E501 = line too long (handled by formatter, not linter)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests can have longer lines and unused imports (for mock fixtures etc.)
"tests/**/*.py" = ["E501", "F811"]

# ── Pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# -v: verbose output (show each test name)
# --tb=short: shorter tracebacks on failure
# --cov: measure coverage for the src/ package
# --cov-report: show missing lines in terminal and write XML for CI upload
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

# ── Coverage configuration ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "app"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
# Fail the CI if coverage drops below this threshold
fail_under = 70
show_missing = true
