[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-llm-cicd"
version = "0.1.0"
description = "MLOps CI/CD pipeline for DistilGPT-2 summarization"
requires-python = ">=3.10"
readme = "README.md"

# ── Ruff configuration ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest.py: sys.modules stubs must run before `import pytest` — E402 is intentional.
"tests/conftest.py" = ["E402"]
# Test files: F811 (redefinition) is fine in tests for fixture overrides.
"tests/**/*.py" = ["E501", "F811"]

# ── Pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "app"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
